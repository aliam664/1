name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Build, test and validate (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python (static validation)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static validation (XAML/XML, JSON, JS, localization, version single-source)
        shell: bash
        run: |
          pip install pyyaml
          python scripts/validate.py

      - name: Restore
        run: dotnet restore ACModHub.sln

      - name: Build (Release)
        run: dotnet build ACModHub.sln -c Release --no-restore

      - name: Test (Release)
        run: dotnet test ACModHub.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"

      - name: git diff --check
        shell: bash
        run: |
          git fetch origin main --depth=1
          git diff --check origin/main...HEAD
