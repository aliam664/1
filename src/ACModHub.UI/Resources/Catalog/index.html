<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src https://aliam664.github.io https://raw.githubusercontent.com https://github.com data:; script-src 'unsafe-inline'; connect-src 'none'; font-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"/>
  <title>AC Mod Hub — Mod Store</title>
  <style>{{CSS}}</style>
</head>
<body>
  <header class="store-header">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true"></div>
      <div>
        <h1 id="store-title" class="brand-title">AC Mod Hub</h1>
        <p id="source-label" class="brand-source"></p>
      </div>
    </div>
    <div class="toolbar">
      <button id="refresh-btn" class="btn" type="button" aria-label="">↻<span class="btn-label"></span></button>
    </div>
  </header>

  <div id="banner" class="banner" role="status" hidden></div>

  <div class="toolbar-row">
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true"></span>
      <input id="search-input" class="search-input" type="search" autocomplete="off" spellcheck="false" placeholder=""
             aria-label=""/>
      <kbd class="kbd" aria-hidden="true">/</kbd>
    </div>
    <div class="chips" id="category-chips" role="group" aria-label=""></div>
    <select id="sort-select" class="select" aria-label="">
      <option value="default"></option>
      <option value="name"></option>
      <option value="newest"></option>
      <option value="version"></option>
    </select>
  </div>

  <main>
    <!-- Skeleton -->
    <section id="skeleton" class="grid" aria-hidden="true"></section>

    <!-- Real grid -->
    <section id="grid" class="grid" aria-label=""></section>

    <!-- States -->
    <div id="state-empty" class="state" hidden>
      <div class="state-icon" aria-hidden="true"></div>
      <h2 class="state-title"></h2>
      <p class="state-hint"></p>
    </div>
    <div id="state-error" class="state" hidden>
      <div class="state-icon state-icon-error" aria-hidden="true"></div>
      <h2 class="state-title"></h2>
      <p class="state-hint"></p>
      <button id="retry-btn" class="btn btn-primary" type="button"></button>
    </div>
  </main>

  <!-- Download progress overlay -->
  <div id="progress-overlay" class="progress-overlay" role="alert" aria-live="polite" hidden>
    <div class="progress-card">
      <p id="progress-text" class="progress-text"></p>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <div class="progress-actions">
        <button id="progress-cancel" class="btn" type="button"></button>
        <button id="progress-close" class="btn" type="button"></button>
      </div>
    </div>
  </div>

  <script>{{JS}}</script>
  <script>
    // Injected safely by the host: escaped against </script>, U+2028/29 and HTML entities.
    window.__ACMH__ = JSON.parse('{{DATA}}');
  </script>
</body>
</html>
